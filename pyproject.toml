[project]
name = "pyqproj"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ali Rizvi", email = "alirizvi433@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bs4>=0.0.2",
    "chromadb>=1.5.9",
    "ddgs>=9.16.1",
    "faiss-cpu>=1.16.0",
    "fastapi>=0.162.3",
    "fastmcp>=4.1.7",
    "langchain>=1.4.9",
    "langchain-aws>=1.9.2",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.7",
    "langchain-experimental>=0.4.2",
    "langchain-google-genai>=4.4.3",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.4",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "langgraph-cli[inmem]>=0.4.42",
    "langgraph-prebuilt>=1.1.1",
    "langgraph-sdk>=0.4.14",
    "langgraph-supervisor>=0.0.31",
    "langsmith>=0.14.17",
    "notebook>=7.6.5",
    "pypdf>=7.0.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
    "trustcall>=0.0.39",
    "uvicorn>=0.54.0",
    "wikipedia>=1.4.0",
]

[project.scripts]
pyqproj = "pyqproj:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]
